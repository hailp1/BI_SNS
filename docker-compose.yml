name: cj_enterprise_standard

services:
  # ===========================================================================
  # 1. TIER 4: ENTERPRISE DATABASE (POSTGRESQL 18)
  # Security Hardened: Isolated internal Docker network + healthcheck + limits
  # ===========================================================================
  standard_postgres:
    image: postgres:18-alpine
    container_name: standard_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cj_enterprise_db}
      POSTGRES_USER: ${POSTGRES_USER:-cj_sec_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - standard_pg_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cj_sec_admin} -d ${POSTGRES_DB:-cj_enterprise_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    networks:
      - standard_network

  # ===========================================================================
  # 2. TIER 4: IN-MEMORY CACHE (REDIS 8)
  # Security Hardened: Authenticated + internal network + healthcheck
  # ===========================================================================
  standard_redis:
    image: redis:8-alpine
    container_name: standard_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - standard_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - standard_network

  # ===========================================================================
  # 3. TIER 3: APPLICATION & BUSINESS LOGIC (NESTJS CLEAN ARCHITECTURE)
  # ===========================================================================
  standard_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standard_backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: "--max-old-space-size=1024"
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
      DATABASE_HOST: standard_postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-cj_sec_admin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_NAME: ${POSTGRES_DB:-cj_enterprise_db}
      REDIS_HOST: standard_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    depends_on:
      standard_postgres:
        condition: service_healthy
      standard_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    networks:
      - standard_network

  # ===========================================================================
  # 4. TIER 2: PERIMETER SECURITY GATEWAY (NGINX + REACT VITE SPA)
  # ===========================================================================
  standard_nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: standard_nginx
    restart: always
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      standard_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - standard_network

  # ===========================================================================
  # 5. AUTOMATED POSTGRESQL BACKUP SIDECAR (Optional: docker compose --profile backup up -d)
  # ===========================================================================
  standard_pg_backup:
    image: postgres:18-alpine
    container_name: standard_pg_backup
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: standard_postgres
      PGUSER: ${POSTGRES_USER:-cj_sec_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-cj_enterprise_db}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c '
      while true; do
        TS=$$(date +%Y%m%d_%H%M%S);
        pg_dump -Fc -f "/backups/cj_enterprise_$$TS.dump";
        find /backups -name "cj_enterprise_*.dump" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      standard_postgres:
        condition: service_healthy
    networks:
      - standard_network

  # ===========================================================================
  # 6. MONITORING STACK (Optional: docker compose --profile monitoring up -d)
  # ===========================================================================
  standard_prometheus:
    image: prom/prometheus:latest
    container_name: standard_prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - standard_network

  standard_grafana:
    image: grafana/grafana:latest
    container_name: standard_grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - standard_prometheus
    networks:
      - standard_network

volumes:
  standard_pg_data:
  standard_redis_data:

networks:
  standard_network:
    driver: bridge
