name: cj_enterprise_standard
version: '3.8'

services:
  # ===========================================================================
  # 1. TIER 4: ENTERPRISE DATABASE (POSTGRESQL 18)
  # Security Hardened: Không mở port ra ngoài Host, chỉ cho phép nội bộ Docker
  # ===========================================================================
  standard_postgres:
    image: postgres:18-alpine
    container_name: standard_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cj_enterprise_db}
      POSTGRES_USER: ${POSTGRES_USER:-cj_sec_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - standard_pg_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - standard_network

  # ===========================================================================
  # 2. TIER 4: IN-MEMORY CACHE (REDIS 8)
  # Security Hardened: Được bảo vệ bởi mật khẩu, cô lập nội bộ
  # ===========================================================================
  standard_redis:
    image: redis:8-alpine
    container_name: standard_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - standard_redis_data:/data
    networks:
      - standard_network

  # ===========================================================================
  # 3. TIER 3: APPLICATION & BUSINESS LOGIC (NESTJS 12 - NODE 24 LTS)
  # Security Hardened: Xác thực Bcrypt, JWT HttpOnly Cookie, 2FA, Audit Log
  # ===========================================================================
  standard_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standard_backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
      DATABASE_HOST: standard_postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-cj_sec_admin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_NAME: ${POSTGRES_DB:-cj_enterprise_db}
      REDIS_HOST: standard_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DATA_PAYLOADS_DIR: ${DATA_PAYLOADS_DIR:-/app/data_payloads}
      PAYLOAD_KEY: ${PAYLOAD_KEY:?PAYLOAD_KEY is required}
      # Cấu hình SMTP Email Gateway (Hỗ trợ Gmail / Office 365 / Exchange Corporate)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    volumes:
      - ./data_payloads:/app/data_payloads:ro
    depends_on:
      - standard_postgres
      - standard_redis
    networks:
      - standard_network

  # ===========================================================================
  # 4. TIER 2: PERIMETER SECURITY GATEWAY (NGINX REVERSE PROXY)
  # Port 8090: Cổng Web duy nhất mở ra Host (Không đụng độ port 8080 của bản POC)
  # ===========================================================================
  standard_nginx:
    image: nginx:1.27-alpine
    container_name: standard_nginx
    restart: always
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web_app:/usr/share/nginx/html/web_app:ro
      - ./client:/usr/share/nginx/html/client:ro
    depends_on:
      - standard_backend
    networks:
      - standard_network

volumes:
  standard_pg_data:
  standard_redis_data:

networks:
  standard_network:
    driver: bridge
