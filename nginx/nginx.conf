events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        text/plain
        image/svg+xml;

    # Rate Limiting (Chống DDoS & Brute-force)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # Enterprise Security Headers (OWASP Recommended)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. API ĐĂNG NHẬP (Áp dụng Rate Limit 5 request/giây chống Brute-force)
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://standard_backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. TOÀN BỘ CÁC API KHÁC (/api/*)
        location /api/ {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://standard_backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. CHẶN TRUY CẬP TĨNH TRỰC TIẾP VÀO DATA PAYLOADS (BẮT BUỘC QUA API JWT AUTH /api/v1/data/)
        location /data_payloads/ {
            return 403;
        }

        # 4. GIAO DIỆN CHUẨN MẪU (LIGHTWEIGHT STANDARD SPA)
        location /standard/ {
            alias /usr/share/nginx/html/client/;
            index index.html;
            try_files $uri $uri/ /standard/index.html;
        }

        # 5. GIAO DIỆN WEB THẬT ĐẦY ĐỦ (FULL ENTERPRISE WEB APP)
        location / {
            root /usr/share/nginx/html/web_app;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
