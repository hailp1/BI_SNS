events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;
    server_tokens off;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        text/plain
        image/svg+xml;

    # Rate Limiting (DDoS & Brute-force protection)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # Enterprise Security Headers (OWASP Recommended)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        # 0. NGINX HEALTHCHECK ENDPOINT
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 1. AUTH LOGIN API (Strict 5r/s Rate Limit)
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://standard_backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. ALL BACKEND REST APIs (/api/*)
        location /api/ {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://standard_backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. BLOCK DIRECT ACCESS TO ENCRYPTED PAYLOADS (Must go through JWT API /api/v1/data/)
        location /data_payloads/ {
            return 403;
        }


        # 6. IMMUTABLE STATIC ASSETS FOR REACT + VITE SPA
        location /assets/ {
            root /usr/share/nginx/html/frontend;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 7. MODERN REACT + TYPESCRIPT ENTERPRISE SPA (Primary Root)
        location / {
            root /usr/share/nginx/html/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
